<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Inflables · Temporada de verano</title>
  <meta name="description" content="Todos los inflables por tipo: para bebés, chicos, colchonetas, islas, botes y piletas. Fotos, medidas y precio." />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="Inflables · Temporada de verano" />
  <meta property="og:description" content="Todos los inflables por tipo: para bebés, chicos, colchonetas, islas, botes y piletas. Fotos, medidas y precio." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#1B2B4B" />
  <link rel="icon" href="img/icono-vs.png?v=3" type="image/png" />
  <link rel="apple-touch-icon" href="img/icono-vs.png?v=3" />
  <link rel="stylesheet" href="css/styles.css?v=12" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,800;1,900&display=swap" />
<style>
  body { background: var(--black); }
  /* ===== Inflables de verano ===== */
  .iv-hero { padding: 34px 0 18px; text-align: center; }
  /* Título con onda: letra del logo (Kanit), "verano" con colores de verano que van cambiando y letras en ola */
  .iv-titulo { font-family: 'Kanit', 'Segoe UI', sans-serif; font-style: italic; font-weight: 900; line-height: .95; letter-spacing: -.01em;
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .iv-t1 { font-size: clamp(2.6rem, 11vw, 4.2rem); color: #0E1E46; text-shadow: 0 3px 0 rgba(1,109,255,.18); }
  .iv-t2 { font-size: clamp(1.1rem, 4.6vw, 1.6rem); color: #013589; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .iv-t3 { position: relative; display: inline-flex; align-items: center; gap: .12em; font-size: clamp(3rem, 14vw, 5.2rem); padding-right: .1em; }
  .iv-t3 > span { display: inline-flex; }
  .iv-t3 > span > span { display: inline-block; padding: 0 .02em;
    background: linear-gradient(90deg, #FA0202, #FF7A00, #FFC400, #00C2FF, #016DFF, #FA0202); background-size: 400% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: ivColores 6s linear infinite, ivOla 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.25s), calc(var(--i) * .12s);
    filter: drop-shadow(0 4px 6px rgba(1,53,137,.18)); }
  .iv-sol { font-size: .5em; color: #FFC400; filter: drop-shadow(0 0 10px rgba(255,196,0,.6)); animation: ivGira 12s linear infinite; }
  @keyframes ivColores { to { background-position: 400% 0; } }
  @keyframes ivOla { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-.12em); } }
  @keyframes ivGira { to { transform: rotate(360deg); } }
  .iv-hero p { color: var(--gray); font-size: 1rem; margin: 10px auto 0; max-width: 62ch; text-wrap: pretty; }
  .iv-pago { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 8px 16px; border-radius: var(--radius-pill);
    background: var(--accent-light); color: var(--accent); font-weight: 700; font-size: .9rem; }
  .iv-pago strong { color: var(--red); }

  .iv-nav { position: sticky; top: var(--iv-top, 0px); z-index: 30; background: rgba(245,247,250,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--black-4); padding: 10px 0; }
  /* Cuando el encabezado de la tienda se esconde al bajar, la barra sube con él (misma animación) */
  .iv-nav { transition: transform .35s ease; }
  html.iv-sin-header .iv-nav { transform: translateY(calc(-1 * var(--iv-top, 0px))); }
  /* Al bajar la barra se esconde para dejar ver más productos; al subir un poco vuelve */
  html.iv-nav-oculta .iv-nav { transform: translateY(calc(-100% - 2px)); box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { .iv-nav { transition: none; } }
  /* Compu: barra en una sola franja (buscador + presupuesto) y grilla compacta de 6 a 8 productos por fila */
  @media (min-width: 900px) {
    .iv-nav .container, #iv-grupos .container { max-width: min(1760px, calc(100vw - 48px)); }
    .iv-nav .container { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; align-items: center; }
    .iv-nav .iv-chips { grid-column: 1 / -1; }
    .iv-presu { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 6px 14px; }
    .iv-presu label { display: contents; }
    .iv-presu label > span { grid-column: 1; grid-row: 1; white-space: nowrap; }
    .iv-presu b { grid-column: 3; grid-row: 1; min-width: 7.5em; text-align: right; }
    .iv-presu input[type=range] { grid-column: 2; grid-row: 1; margin: 0; }
    .iv-presu-lim { display: none; }
    #iv-grupos .iv-grid { grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
    #iv-grupos .iv-grid .iv-info { padding: 10px 12px 12px; gap: 7px; }
    #iv-grupos .iv-grid .iv-nombre { font-size: .9rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
    #iv-grupos .iv-grid .iv-medidas span { font-size: .7rem; padding: 3px 7px; }
    #iv-grupos .iv-grid .iv-medidas span:nth-child(n+2) { display: none; }
    #iv-grupos .iv-grid .iv-colores button { font-size: .72rem; padding: 3px 8px; }
    #iv-grupos .iv-grid .iv-desc summary { font-size: .78rem; }
    #iv-grupos .iv-grid .iv-precio b { font-size: 1.18rem; }
    #iv-grupos .iv-grid .iv-entrega { display: none; }
    #iv-grupos .iv-grid .iv-comprar { min-height: 40px; font-size: .86rem; gap: 7px; border-radius: 10px; }
    #iv-grupos .iv-grid .iv-comprar i { font-size: 1.05rem; }
    #iv-grupos .iv-grid .iv-flecha { width: 30px; height: 30px; }
  }
  .iv-nav .container { display: flex; flex-direction: column; gap: 10px; }
  .iv-buscar { position: relative; }
  .iv-buscar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); }
  .iv-buscar input { width: 100%; font: inherit; font-size: 1rem; min-height: 44px; padding: 10px 14px 10px 40px; border-radius: 12px;
    border: 1.5px solid var(--black-4); background: #fff; color: var(--white); }
  .iv-buscar input:focus { outline: none; border-color: var(--accent); }
  /* Presupuesto: deslizador que recorre los precios reales (del más barato al más caro) */
  .iv-presu { background: #fff; border: 1px solid var(--black-4); border-radius: 12px; padding: 10px 14px 8px; }
  .iv-presu label { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: .9rem; font-weight: 700; color: #0E1E46; }
  .iv-presu label i { color: var(--red); margin-right: 4px; }
  .iv-presu b { font-family: 'Kanit', 'Segoe UI', sans-serif; font-size: 1.15rem; font-weight: 800; color: var(--red); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .iv-presu input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 4px 0 0; background: transparent; cursor: pointer; touch-action: pan-y; }
  .iv-presu input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: linear-gradient(90deg, #FA0202 0 var(--p, 100%), #dfe4ee var(--p, 100%) 100%); }
  .iv-presu input[type=range]::-moz-range-track { height: 6px; border-radius: 99px; background: linear-gradient(90deg, #FA0202 0 var(--p, 100%), #dfe4ee var(--p, 100%) 100%); }
  .iv-presu input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff;
    border: 3px solid #FA0202; box-shadow: 0 2px 8px rgba(14,30,70,.25); transition: transform .15s ease; }
  .iv-presu input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid #FA0202; box-shadow: 0 2px 8px rgba(14,30,70,.25); }
  .iv-presu input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
  .iv-presu input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .iv-presu-lim { display: flex; justify-content: space-between; font-size: .75rem; color: var(--gray); font-weight: 600; font-variant-numeric: tabular-nums; }
  .iv-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .iv-chip { cursor: pointer; font-family: inherit; }
  .iv-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--black-4); background: #fff; color: var(--white);
    border-radius: var(--radius-pill); padding: 0 14px; min-height: 38px; font-size: .86rem; font-weight: 700; text-decoration: none; transition: border-color .2s ease, background-color .2s ease; }
  .iv-chip:hover { border-color: #c5cbd8; }
  .iv-chip span { color: var(--gray); font-weight: 600; font-variant-numeric: tabular-nums; }
  .iv-chip.activo { background: var(--red-light); color: var(--red); border-color: rgba(204,18,18,.45); }

  .iv-grupo { padding: 30px 0 8px; scroll-margin-top: calc(var(--iv-top, 0px) + 120px); }
  .iv-grupo h2 { font-size: clamp(1.35rem, 3vw, 1.75rem); font-weight: 900; letter-spacing: -.015em; display: flex; align-items: baseline; gap: 10px; }
  .iv-grupo h2 small { font-size: .9rem; color: var(--gray); font-weight: 600; }
  .iv-grupo > .container > p { color: var(--gray); margin: 4px 0 16px; }
  .iv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }

  .iv-card { background: #fff; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-card);
    border: 1px solid var(--border-default); scroll-margin-top: calc(var(--iv-top, 0px) + 130px); }
  .iv-card:target { outline: 3px solid rgba(204,18,18,.45); }
  .iv-gal { position: relative; background: #fff; }
  .iv-fotos { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 1 / 1; }
  .iv-fotos::-webkit-scrollbar { display: none; }
  /* La foto se ve COMPLETA (sin recortes); el espacio que sobra lo llena la misma foto ampliada y desenfocada (nunca franjas blancas) */
  .iv-slide { position: relative; flex: 0 0 100%; width: 100%; height: 100%; overflow: hidden; scroll-snap-align: center; background: #e9eef6; }
  .iv-slide::before { content: ""; position: absolute; inset: -12%; background: var(--bg) center / cover no-repeat; filter: blur(18px) saturate(1.15); opacity: .9; }
  .iv-slide img { position: relative; display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }
  .iv-cuenta { position: absolute; right: 10px; bottom: 10px; background: rgba(27,42,75,.82); color: #fff; font-size: .75rem; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .iv-flecha { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92);
    box-shadow: 0 2px 10px rgba(0,0,0,.15); color: var(--accent); cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity .2s ease; }
  .iv-flecha.izq { left: 8px; } .iv-flecha.der { right: 8px; }
  .iv-gal:hover .iv-flecha, .iv-flecha:focus-visible { opacity: 1; }
  @media (hover: none) { .iv-flecha { display: none; } }
  .iv-info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .iv-nombre { font-size: 1rem; font-weight: 800; line-height: 1.3; color: var(--white); text-wrap: pretty; }
  .iv-medidas { display: flex; flex-wrap: wrap; gap: 6px; }
  .iv-medidas span { font-size: .78rem; background: var(--accent-light); color: var(--accent); padding: 4px 9px; border-radius: 8px; font-weight: 600; }
  .iv-colores { display: flex; flex-wrap: wrap; gap: 6px; }
  .iv-colores button { font: inherit; font-size: .8rem; font-weight: 700; border: 1.5px solid var(--black-4); background: #fff; color: var(--white);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; min-height: 32px; }
  .iv-colores button[aria-pressed="true"] { border-color: var(--red); color: var(--red); background: var(--red-light); }
  .iv-precio { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
  .iv-precio b { font-size: 1.45rem; font-weight: 900; color: var(--white); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .iv-precio s { color: var(--gray); font-size: .85rem; margin-left: 6px; font-weight: 500; }
  .iv-precio small { font-size: .84rem; color: var(--accent); font-weight: 600; }
  .iv-precio small strong { color: var(--red); }
  .iv-off { display: inline-block; margin-left: 8px; background: var(--red); color: #fff; font-size: .72rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; vertical-align: 3px; }
  .iv-desc summary { cursor: pointer; font-size: .86rem; font-weight: 700; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  .iv-desc summary::-webkit-details-marker { display: none; }
  .iv-desc summary i { transition: transform .2s ease; font-size: .75rem; }
  .iv-desc[open] summary i { transform: rotate(180deg); }
  .iv-desc > div { margin-top: 8px; font-size: .86rem; color: #374151; line-height: 1.5; }
  .iv-desc ul { padding-left: 18px; margin: 4px 0 8px; }
  .iv-desc p { margin: 4px 0 8px; }
  .iv-comprar { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 12px; background: var(--accent);
    color: #fff; font-weight: 800; font-size: .98rem; text-decoration: none; transition: background-color .2s ease, transform .15s ease; }
  .iv-comprar:hover { background: var(--accent-dark); }
  .iv-comprar:active { transform: scale(.98); }
  .iv-comprar i { font-size: 1.2rem; }
  .iv-card.agotado .iv-fotos img { opacity: .55; }
  .iv-sin { color: var(--gray); font-weight: 700; }
  .iv-vacio { text-align: center; padding: 50px 16px; color: var(--gray); }
  /* Bloque de consultas: centrado, título con brillo que pasa y botón verde de WhatsApp */
  .iv-ayuda { margin: 36px 0 56px; background: radial-gradient(120% 140% at 0% 0%, rgba(250,2,2,.22), transparent 55%),
      radial-gradient(120% 140% at 100% 100%, rgba(1,109,255,.30), transparent 55%), #0E1E46;
    color: #fff; border-radius: 22px; padding: clamp(26px, 6vw, 40px) 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .iv-ayuda-titulo { font-family: 'Kanit', 'Segoe UI', sans-serif; font-style: italic; font-weight: 900; font-size: clamp(1.6rem, 6.5vw, 2.2rem); line-height: 1.05;
    background: linear-gradient(100deg, #fff 0%, #fff 40%, #A8F6FF 48%, #FFC400 52%, #fff 60%, #fff 100%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: ivBrillo 3.5s ease-in-out infinite; text-wrap: balance; }
  @keyframes ivBrillo { 0% { background-position: 100% 0; } 60%, 100% { background-position: -50% 0; } }
  .iv-wa { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 58px; padding: 0 30px; border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), #25D366; color: #fff; font-weight: 800; font-size: 1.12rem; text-decoration: none;
    box-shadow: 0 8px 22px rgba(37,211,102,.38), inset 0 -3px 0 rgba(0,0,0,.12); transition: transform .15s ease, box-shadow .2s ease; white-space: nowrap; }
  .iv-wa i { font-size: 1.6rem; }
  .iv-wa:hover { box-shadow: 0 10px 28px rgba(37,211,102,.5), inset 0 -3px 0 rgba(0,0,0,.12); }
  .iv-wa:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { .iv-ayuda-titulo { animation: none; } .iv-wa { transition: none; } }
  /* Retiro / envío: tarjeta con ícono y dos líneas */
  .iv-entrega-hero { margin: 18px auto 0; display: inline-flex; align-items: center; gap: 14px; text-align: left; padding: 12px 20px 12px 12px;
    border-radius: 18px; background: #fff; box-shadow: 0 2px 8px rgba(14,30,70,.08), 0 10px 26px rgba(14,30,70,.10); border: 1px solid rgba(1,109,255,.12); }
  .iv-ent-ico { flex: 0 0 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-size: 1.25rem;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%), linear-gradient(135deg, #FC3538, #DD0201 48%, #013589 52%, #01245D);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
  .iv-ent-txt { display: flex; flex-direction: column; line-height: 1.2; }
  .iv-ent-txt strong { font-family: 'Kanit', 'Segoe UI', sans-serif; font-weight: 800; font-size: 1.12rem; color: #0E1E46; }
  .iv-ent-txt small { font-size: .9rem; color: #4B5563; font-weight: 600; }
  .iv-entrega i { color: var(--red); }
  .iv-entrega { font-size: .86rem; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center; }

  /* Vista grande (celular): panel a pantalla completa que se agranda desde la foto */
  .iv-ov[hidden] { display: none; }
  .iv-ov { position: fixed; inset: 0; z-index: 200; }
  .iv-ov-fondo { position: absolute; inset: 0; background: rgba(15,23,42,.55); }
  .iv-ov-panel { position: absolute; inset: 0; background: #fff; overflow-y: auto; overscroll-behavior: contain; transform-origin: 0 0; will-change: transform, clip-path; }
  .iv-ov-cerrar { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 3; width: 42px; height: 42px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.92); box-shadow: 0 2px 12px rgba(0,0,0,.18); color: var(--accent); font-size: 1.15rem; display: grid; place-items: center; cursor: pointer; }
  .iv-ov .iv-card { border-radius: 0; box-shadow: none; border: 0; min-height: 100%; }
  .iv-ov .iv-info { padding: 16px 18px calc(24px + env(safe-area-inset-bottom)); gap: 12px; }
  .iv-ov .iv-nombre { font-size: 1.15rem; }
  .iv-ov .iv-precio b { font-size: 1.7rem; }
  .iv-ov .iv-cuenta { bottom: 12px; right: 12px; }
  html.iv-fijo, html.iv-fijo body { overflow: hidden; }

  @media (max-width: 640px) {
    .iv-grupo { padding-top: 20px; }
    .iv-grupo > .container > p { display: none; }
    .iv-grupo h2 { margin-bottom: 10px; }
    /* Grilla de fotos, 3 por fila, como en Instagram */
    /* Casi de borde a borde (6 px a cada lado) y cada foto como un botón: puntas redondeadas y sombra suave */
    .iv-grid { grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 0 -10px; }
    .iv-grid .iv-card { border-radius: 14px; overflow: hidden; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 6px rgba(15, 23, 42, .10), 0 6px 16px rgba(15, 23, 42, .08); transition: transform .15s ease, box-shadow .15s ease; }
    .iv-grid .iv-card:active { transform: scale(.95); box-shadow: 0 1px 3px rgba(15, 23, 42, .14); }
    .iv-grid .iv-info, .iv-grid .iv-cuenta, .iv-grid .iv-flecha { display: none; }
    .iv-grid .iv-fotos { overflow: hidden; pointer-events: none; }
    .iv-grid .iv-fotos .iv-slide:not(:first-child) { display: none; }
    .iv-grid .iv-card.agotado::after { content: "Sin stock"; position: absolute; left: 6px; bottom: 6px; background: rgba(27,43,75,.85); color: #fff;
      font-size: .62rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .iv-grid .iv-card { position: relative; }
    .iv-card:target { outline: none; }
  }
  @media (prefers-reduced-motion: reduce) { .iv-t3 > span > span, .iv-sol { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .iv-fotos { scroll-behavior: auto; } .iv-comprar, .iv-desc summary i, .iv-flecha, .iv-grid .iv-card { transition: none; } }
</style>
</head>
<body>
<main id="inflables">
  <section class="iv-hero">
    <div class="container">
      <h1 class="iv-titulo"><span class="iv-t1">Inflables</span> <span class="iv-t2">para este</span>
        <span class="iv-t3" aria-label="verano"><span aria-hidden="true"><span style="--i:0">v</span><span style="--i:1">e</span><span style="--i:2">r</span><span style="--i:3">a</span><span style="--i:4">n</span><span style="--i:5">o</span></span><i class="fa-solid fa-sun iv-sol" aria-hidden="true"></i></span></h1>
      <div class="iv-entrega-hero">
        <span class="iv-ent-ico" aria-hidden="true"><i class="fa-solid fa-truck-fast"></i></span>
        <span class="iv-ent-txt"><strong>Retirás por el lote 707</strong><small>o te lo llevamos a tu lote</small></span>
      </div>
    </div>
  </section>

  <nav class="iv-nav" aria-label="Tipos de inflables">
    <div class="container">
      <label class="iv-buscar">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input type="search" id="iv-buscar" placeholder="Buscar: flamenco, isla, kayak, 1,83 m…" aria-label="Buscar inflable" autocomplete="off">
      </label>
      <div class="iv-presu" id="iv-presu" hidden>
        <label for="iv-precio"><span><i class="fa-solid fa-wallet" aria-hidden="true"></i> ¿Hasta cuánto querés gastar?</span> <b id="iv-precio-txt">Todos</b></label>
        <input type="range" id="iv-precio" min="0" max="0" step="1" value="0">
        <div class="iv-presu-lim"><span id="iv-pmin"></span><span id="iv-pmax"></span></div>
      </div>
      <div class="iv-chips" id="iv-chips"></div>
    </div>
  </nav>

  <div id="iv-grupos" aria-live="polite">
    <p class="iv-vacio">Cargando inflables…</p>
  </div>

  <div class="container">
    <section class="iv-ayuda">
      <h2 class="iv-ayuda-titulo">¿Dudas con algún modelo?</h2>
      <a class="iv-wa" id="iv-consulta" href="#" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Consultar por WhatsApp</a>
    </section>
  </div>
</main>


<script src="js/sheets.js?v=20"></script>
<script src="js/productos.js?v=16"></script>
<script>
  // ===== Inflables de verano: todos los modelos por tipo; "Comprar" abre WhatsApp con el pedido armado =====
  const IV_WA = "5491131751517";          // WhatsApp personal del dueño para estas ventas
  const IV_PRECIO_MINIMO = 5000;          // menos que esto = precio mal cargado: se muestra "Consultar precio"
  const IV_PAGINA = "https://inflables.virtualshopbaires.com.ar/";   // subdominio: redirección de Cloudflare a esta página

  // Orden de evaluación: el primero que coincide gana. "orden" = en qué orden se muestran en la página.
  const IV_GRUPOS = [
    { id: "bebes", orden: 1, titulo: "Para bebés", texto: "Flotadores con asiento y protección solar, y piletas con techo.",
      re: /beb[eé]|uv ?50|uvcare|swim safe|3 anillos/i },
    { id: "accesorios", orden: 9, titulo: "Infladores, hieleras y colchones", texto: "Para inflar todo rápido y para llevar a la pileta o al camping.",
      re: /^inflador|inflador manual|hielera|colch[oó]n (cama|inflable una)/i },
    { id: "juegos", orden: 8, titulo: "Juegos para la pileta", texto: "Aros de básquet, redes de vóley, arcos y deslizadores.",
      re: /b[aá]squet|v[oó]ley|water polo|arco y pelota|deslizador|punch/i },
    { id: "piletas", orden: 7, titulo: "Piletas", texto: "Inflables, rígidas y estructurales, y centros de juego con tobogán.",
      re: /^(pileta|alberca|piscina|centro de juegos|pelotero|isla inflable mini)/i },
    { id: "chicos", orden: 2, titulo: "Para chicos", texto: "Montables, botecitos y salvavidas infantiles.",
      re: /infantil|niñ[oa]|polic[ií]a|nave espacial|narval|unicornio chico/i },
    { id: "botes", orden: 6, titulo: "Botes, kayaks y balsas", texto: "Para lagos, ríos y el mar, con remos.",
      re: /\b(bote|kayak|balsa|raft|voyager)\b/i },
    { id: "grandes", orden: 5, titulo: "Islas y flotadores para varios", texto: "Los más grandes: para 2 o más personas.",
      re: /isla|[2-9] personas|doble|summer oasis|frutas/i },
    { id: "colchonetas", orden: 4, titulo: "Colchonetas, camastros y sillones", texto: "Para tirarse al sol en la pileta.",
      re: /camastro|^colchoneta(?!.*dona)/i },
    { id: "flotadores", orden: 3, titulo: "Flotadores y salvavidas", texto: "Para adolescentes y adultos: donas, montables y salvavidas grandes.",
      re: /salvavidas|montable|para montar|cobra|drag[oó]n|dodo|unic[oó]rnio|flamingo|lancha|paleta de hielo|dona/i },
    { id: "colchonetas", re: /./ },   // el resto: colchonetas
  ];
  const ivGrupoDe = (p) => IV_GRUPOS.find(g => g.re.test(p.nombre)).id;
  const ivInfoGrupo = (id) => IV_GRUPOS.find(g => g.id === id && g.titulo);

  const ivSlug = (t) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 70);
  const ivNombre = (n) => String(n).replace(/\s*\[[^\]]*\]/g, "").replace(/\s{2,}/g, " ").replace(/\b(\w+) \1$/i, "$1").trim();

  // Medidas: las líneas de la descripción con diámetro, tamaño, capacidad, edad…; si no hay, las del nombre
  function ivMedidas(p) {
    const lineas = String(p.descripcion || "").split("\n").map(l => l.replace(/^[-•]\s*/, "").trim());
    const re = /^(di[aá]metro|tama[ñn]o|medidas?|dimensiones|largo|ancho|alto|altura|capacidad|edad|peso|soporta|carga)[^:]{0,30}:\s*(.+)$/i;
    const out = [];
    lineas.forEach(l => { const m = re.exec(l); if (m && out.length < 4) out.push(l.replace(/\s+/g, " ").slice(0, 60)); });
    if (!out.length) {
      const m = String(p.nombre).match(/\d+(?:[.,]\d+)?\s*x\s*\d+(?:[.,]\d+)?(?:\s*x\s*\d+(?:[.,]\d+)?)?\s*(?:cm|m)\b|\d+(?:[.,]\d+)?\s*(?:m|mts)\b|\d+\s*(?:l|lt|lts)\b/gi);
      (m || []).slice(0, 2).forEach(x => out.push("Medida: " + x));
    }
    return out;
  }

  // Todas las fotos del producto y de sus colores, sin repetir
  function ivFotos(p) {
    const fotos = [...(p.imagenes || []), ...(p.imagen ? [p.imagen] : [])];
    (p.variantes || []).forEach(v => { fotos.push(...(v.imagenes || [])); if (v.imagen) fotos.push(v.imagen); });
    return [...new Set(fotos.map(u => String(u).split("#")[0]).filter(Boolean))];
  }

  const ivEstado = {};   // id → { color }
  function ivVariante(p) {
    const vs = (p.variantes || []).filter(v => v.stock !== false);
    if (!vs.length) return null;
    const c = (ivEstado[p.id] || {}).color;
    return vs.find(v => v.color === c) || vs[0];
  }
  function ivPrecio(p) {
    const v = ivVariante(p);
    const precio = Number(v ? v.precio : p.precio) || 0;
    const original = Number(v ? v.precioOriginal : p.precioOriginal) || 0;
    return { precio, original: original > precio ? original : 0, valido: precio >= IV_PRECIO_MINIMO || ivGrupoDe(p) === "accesorios" && precio > 0 };
  }

  function ivLinkWa(p) {
    const v = ivVariante(p), pr = ivPrecio(p), colores = (p.variantes || []).filter(x => x.stock !== false && x.color).length;
    const det = [];
    if (v && colores > 1 && v.color) det.push(`• Color: ${v.color}`);
    const lineas = p.agotado || !hayStock(p)
      ? [`Hola! Quería saber cuándo vuelve a entrar este inflable:`, `• ${ivNombre(p.nombre)}`]
      : pr.valido
        ? [`Hola! Quiero comprar este inflable:`, `• ${ivNombre(p.nombre)}`, ...det,
           `• Precio: ${ivPrecioFinal(pr.precio)}`, `• Entrega: retiro por el lote 707 / me lo traen a mi lote (N° ___)`, `¿Está disponible?`]
        : [`Hola! Quiero comprar este inflable y saber el precio:`, `• ${ivNombre(p.nombre)}`, ...det];
    lineas.push(`${IV_PAGINA}#${ivSlug(p.nombre)}`);
    return `https://wa.me/${IV_WA}?text=${encodeURIComponent(lineas.join("\n"))}`;
  }

  const ivPrecioFinal = (precio) => formatPrecio(Math.round(precioTransferencia(precio)));

  function ivPrecioHTML(p) {
    if (p.agotado || !hayStock(p)) return `<div class="iv-precio"><span class="iv-sin">Sin stock por ahora</span></div>`;
    const pr = ivPrecio(p);
    if (!pr.valido) return `<div class="iv-precio"><b>Consultar precio</b></div>`;
    // Solo el precio final (el de la tienda con el 10% ya descontado, redondeado al peso), sin aclaraciones
    return `<div class="iv-precio"><b>${ivPrecioFinal(pr.precio)}</b></div>`;
  }

  function ivTarjeta(p, enGrande) {
    const fotos = ivFotos(p), id = ivSlug(p.nombre), sin = p.agotado || !hayStock(p);
    const colores = (p.variantes || []).filter(v => v.stock !== false && v.color && v.color.toLowerCase() !== "único" && v.color.toLowerCase() !== "unico");
    const nombre = ivNombre(p.nombre);
    return `<article class="iv-card${sin ? " agotado" : ""}"${enGrande ? "" : ` id="${_escAttr(id)}" tabindex="0" aria-label="Ver ${_escAttr(nombre)}"`} data-pid="${p.id}">
      <div class="iv-gal">
        <div class="iv-fotos" tabindex="0" aria-label="Fotos de ${_escAttr(nombre)}">
          ${fotos.map((u, i) => `<div class="iv-slide" style="--bg:url('${_escAttr(fotoSrc(u)).replace(/'/g, "%27")}')"><img src="${_escAttr(fotoSrc(u))}" alt="${_escAttr(nombre)}${fotos.length > 1 ? " · foto " + (i + 1) : ""}" ${i ? 'loading="lazy"' : ""} decoding="async" onerror="fotoRespaldo(this)"></div>`).join("") ||
            `<div style="flex:0 0 100%;display:grid;place-items:center;color:#c5cbd8;font-size:3rem"><i class="fa-solid fa-life-ring" aria-hidden="true"></i></div>`}
        </div>
        ${fotos.length > 1 ? `<span class="iv-cuenta">1/${fotos.length}</span>
          <button type="button" class="iv-flecha izq" aria-label="Foto anterior" data-dir="-1"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
          <button type="button" class="iv-flecha der" aria-label="Foto siguiente" data-dir="1"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>` : ""}
      </div>
      <div class="iv-info">
        <h3 class="iv-nombre">${_escHTML(nombre)}</h3>
        ${(() => { const m = ivMedidas(p); return m.length ? `<div class="iv-medidas">${m.map(x => `<span>${_escHTML(x)}</span>`).join("")}</div>` : ""; })()}
        ${colores.length > 1 ? `<div class="iv-colores" role="group" aria-label="Color">${colores.map((v, i) =>
          `<button type="button" data-color="${_escAttr(v.color)}" aria-pressed="${i === 0}">${_escHTML(v.color)}</button>`).join("")}</div>` : ""}
        ${p.descripcion ? `<details class="iv-desc"><summary>Ver descripción <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></summary><div>${descripcionHTML(p.descripcion)}</div></details>` : ""}
        <div class="iv-precio-caja">${ivPrecioHTML(p)}</div>
        ${sin ? "" : `<p class="iv-entrega"><i class="fa-solid fa-house" aria-hidden="true"></i> Retirás por el lote 707 o te lo llevamos a tu lote</p>`}
        <a class="iv-comprar" href="${_escAttr(ivLinkWa(p))}" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> ${sin ? "Avisame cuando entra" : "Comprar por WhatsApp"}</a>
      </div>
    </article>`;
  }

  // Los que van primero en "Todos" (los más vendidos que elija el dueño): parte del nombre, en este orden.
  // Si la lista está vacía, el orden es el ranking de más vendidos de la tienda (ya viene mezclado).
  const IV_PRIMEROS = ["colchoneta doble con apoya", "43023", "hielera deportiva", "dona bestway", "voley inflable"];
  const ivPrimero = (p) => { const n = ivNombre(p.nombre).toLowerCase(); const i = IV_PRIMEROS.findIndex(x => n.includes(String(x).toLowerCase())); return i < 0 ? 1e6 : i; };

  // Presupuesto: el deslizador recorre los precios finales reales, ordenados (cada paso suma o saca al menos un producto)
  let ivPrecios = [];
  const ivFinal = (p) => { const pr = ivPrecio(p); return pr.valido ? Math.round(precioTransferencia(pr.precio)) : null; };
  function ivTope() {
    const r = document.getElementById("iv-precio");
    return !ivPrecios.length || Number(r.value) >= ivPrecios.length - 1 ? null : ivPrecios[Number(r.value)];
  }
  function ivPresuTexto() {
    const r = document.getElementById("iv-precio"), t = ivTope();
    r.style.setProperty("--p", (ivPrecios.length > 1 ? Number(r.value) / (ivPrecios.length - 1) * 100 : 100) + "%");
    const txt = t === null ? "Todos" : "Hasta " + formatPrecio(t);
    document.getElementById("iv-precio-txt").textContent = txt;
    r.setAttribute("aria-valuetext", txt);
  }
  function ivPresuIniciar() {
    ivPrecios = [...new Set(ivLista.map(ivFinal).filter(x => x > 0))].sort((a, b) => a - b);
    if (ivPrecios.length < 2) return;
    const r = document.getElementById("iv-precio");
    r.max = ivPrecios.length - 1; r.value = ivPrecios.length - 1;
    document.getElementById("iv-pmin").textContent = formatPrecio(ivPrecios[0]);
    document.getElementById("iv-pmax").textContent = formatPrecio(ivPrecios[ivPrecios.length - 1]);
    document.getElementById("iv-presu").hidden = false;
    ivPresuTexto();
    r.addEventListener("input", () => { ivPresuTexto(); ivPintar(); });
  }

  let ivLista = [];
  let ivCat = "todos";   // "todos" o el id de un grupo
  function ivPintar() {
    const q = document.getElementById("iv-buscar").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const tope = ivTope();
    const enPresu = (p) => { if (tope === null) return true; const f = ivFinal(p); return f !== null && f <= tope; };
    const coincide = (p) => enPresu(p) && (!q || (p.nombre + " " + (p.descripcion || "")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(q));
    const visibles = ivLista.filter(coincide);
    const conStock = visibles.filter(p => !p.agotado && hayStock(p)), sinStock = visibles.filter(p => p.agotado || !hayStock(p));
    const grupos = IV_GRUPOS.filter(g => g.titulo).sort((a, b) => a.orden - b.orden)
      .map(g => ({ ...g, items: conStock.filter(p => ivGrupoDe(p) === g.id) })).filter(g => g.items.length);
    if (sinStock.length) grupos.push({ id: "sin-stock", titulo: "Sin stock por ahora", texto: "Tocá el botón y te avisamos cuando vuelvan a entrar.", items: sinStock });
    if (ivCat !== "todos" && !grupos.some(g => g.id === ivCat)) ivCat = "todos";

    // Botones de tipo: "Todos" (todo mezclado) y cada grupo; filtran, no saltan
    document.getElementById("iv-chips").innerHTML =
      `<button type="button" class="iv-chip${ivCat === "todos" ? " activo" : ""}" data-cat="todos" aria-pressed="${ivCat === "todos"}">Todos <span>${conStock.length}</span></button>` +
      grupos.map(g => `<button type="button" class="iv-chip${ivCat === g.id ? " activo" : ""}" data-cat="${g.id}" aria-pressed="${ivCat === g.id}">${_escHTML(g.titulo)} <span>${g.items.length}</span></button>`).join("");

    // "Todos": una sola grilla con todo mezclado (primero los elegidos, después por más vendidos); sin stock al final
    const vista = ivCat === "todos"
      ? [{ id: "todos", titulo: "Todos los inflables", texto: "", items: [...conStock].sort((a, b) => ivPrimero(a) - ivPrimero(b) || (a.orden ?? 1e9) - (b.orden ?? 1e9) || a.id - b.id) },
         ...(sinStock.length ? [grupos[grupos.length - 1]] : [])]
      : grupos.filter(g => g.id === ivCat);
    document.getElementById("iv-grupos").innerHTML = vista.length && vista[0].items.length + (vista[1] ? vista[1].items.length : 0) ? vista.map(g => `
      <section class="iv-grupo" id="g-${g.id}" aria-labelledby="t-${g.id}">
        <div class="container">
          <h2 id="t-${g.id}">${_escHTML(g.titulo)} <small>${g.items.length} modelo${g.items.length !== 1 ? "s" : ""}</small></h2>
          ${g.texto ? `<p>${_escHTML(g.texto)}</p>` : ""}
          <div class="iv-grid">${g.items.map(ivTarjeta).join("")}</div>
        </div>
      </section>`).join("") : `<p class="iv-vacio">No encontramos inflables${q ? ` con «${_escHTML(q)}»` : ""}${tope !== null ? ` hasta ${formatPrecio(tope)}` : ""}. Probá con otra búsqueda, subí el presupuesto o escribinos por WhatsApp.</p>`;
  }
  // Tocar un tipo: filtra y vuelve arriba de la lista
  document.getElementById("iv-chips").addEventListener("click", e => {
    const b = e.target.closest(".iv-chip");
    if (!b || b.dataset.cat === ivCat) return;
    ivCat = b.dataset.cat;
    ivPintar();
    b.scrollIntoView({ block: "nearest", inline: "center", behavior: ivSinMov.matches ? "auto" : "smooth" });
    const g = document.getElementById("iv-grupos"), y = g.getBoundingClientRect().top + scrollY - document.querySelector(".iv-nav").offsetHeight - 8;
    if (scrollY > y) window.scrollTo({ top: y, behavior: "auto" });
  });

  // Galería: contador al deslizar y flechas en compu
  document.addEventListener("scroll", e => {
    const f = e.target.closest && e.target.closest(".iv-fotos");
    if (!f) return;
    const n = Math.round(f.scrollLeft / f.clientWidth) + 1, c = f.parentElement.querySelector(".iv-cuenta");
    if (c) c.textContent = `${n}/${f.children.length}`;
  }, true);
  document.addEventListener("click", e => {
    if (!e.target.closest) return;
    const fl = e.target.closest(".iv-flecha");
    if (fl) { const f = fl.parentElement.querySelector(".iv-fotos"); f.scrollBy({ left: f.clientWidth * Number(fl.dataset.dir), behavior: "smooth" }); return; }
    const b = e.target.closest(".iv-colores button");
    if (!b) return;
    const card = b.closest(".iv-card"), p = PRODUCTOS.find(x => x.id === Number(card.dataset.pid));
    ivEstado[p.id] = { color: b.dataset.color };
    card.querySelectorAll(".iv-colores button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    card.querySelector(".iv-precio-caja").innerHTML = ivPrecioHTML(p);
    card.querySelector(".iv-comprar").href = ivLinkWa(p);
    // Si el color tiene foto propia, se muestra
    const v = ivVariante(p), foto = v && ((v.imagenes || [])[0] || v.imagen);
    if (foto) {
      const imgs = [...card.querySelectorAll(".iv-fotos img")], i = imgs.findIndex(im => im.getAttribute("src") === fotoSrc(String(foto).split("#")[0]));
      if (i >= 0) { const f = card.querySelector(".iv-fotos"); f.scrollTo({ left: f.clientWidth * i, behavior: "smooth" }); }
    }
  });

  // ===== Celular: grilla de fotos (3 por fila); al tocar una, se agranda con animación =====
  const ivCelu = window.matchMedia("(max-width: 640px)");
  const ivEsCelu = () => ivCelu.matches;
  const ivSinMov = window.matchMedia("(prefers-reduced-motion: reduce)");
  const ivOv = document.createElement("div");
  ivOv.className = "iv-ov"; ivOv.hidden = true;
  ivOv.innerHTML = `<div class="iv-ov-fondo"></div>
    <div class="iv-ov-panel" role="dialog" aria-modal="true" aria-label="Detalle del inflable">
      <button type="button" class="iv-ov-cerrar" aria-label="Cerrar"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      <div class="iv-ov-cont"></div>
    </div>`;
  document.body.appendChild(ivOv);
  const ivPanel = ivOv.querySelector(".iv-ov-panel"), ivFondo = ivOv.querySelector(".iv-ov-fondo");
  let ivOrigen = null, ivAnim = null;
  const IV_CURVA = "cubic-bezier(.2,.8,.2,1)";

  // Desde dónde y hasta dónde: el panel arranca encogido y recortado justo sobre la foto tocada
  function ivDesde(tile) {
    const r = tile.getBoundingClientRect(), f = ivPanel.getBoundingClientRect(), k = r.width / f.width;
    return { transform: `translate(${r.left - f.left}px, ${r.top - f.top}px) scale(${k})`,
             clipPath: `inset(0px 0px ${Math.max(0, f.height - f.width)}px 0px round ${8 / k}px)` };
  }
  function ivAbrir(tile) {
    const p = PRODUCTOS.find(x => x.id === Number(tile.dataset.pid));
    if (!p) return;
    ivOrigen = tile;
    ivOv.querySelector(".iv-ov-cont").innerHTML = ivTarjeta(p, true);
    ivPanel.scrollTop = 0;
    ivOv.hidden = false;
    document.documentElement.classList.add("iv-fijo");
    if (history.state === null || !history.state.ivGrande) history.pushState({ ivGrande: 1 }, "");
    if (ivAnim) ivAnim.cancel();
    if (ivSinMov.matches) { ivFondo.animate([{ opacity: 0 }, { opacity: 1 }], 160); ivPanel.animate([{ opacity: 0 }, { opacity: 1 }], 200); }
    else {
      const d = ivDesde(tile);
      ivFondo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 360, easing: "ease-out" });
      ivAnim = ivPanel.animate([d, { transform: "none", clipPath: "inset(0px 0px 0px 0px round 0px)" }], { duration: 440, easing: IV_CURVA });
    }
    ivOv.querySelector(".iv-ov-cerrar").focus({ preventScroll: true });
  }
  function ivCerrar() {
    if (ivOv.hidden) return;
    const fin = () => { ivOv.hidden = true; document.documentElement.classList.remove("iv-fijo"); ivOv.querySelector(".iv-ov-cont").innerHTML = ""; if (ivOrigen) ivOrigen.focus({ preventScroll: true }); };
    const r = ivOrigen && ivOrigen.getBoundingClientRect();
    const visible = r && r.bottom > 0 && r.top < innerHeight;
    if (ivAnim) ivAnim.cancel();
    if (ivSinMov.matches || !visible) {
      ivFondo.animate([{ opacity: 1 }, { opacity: 0 }], 200);
      ivPanel.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(24px)" }], { duration: 220, easing: "ease-in" }).onfinish = fin;
      return;
    }
    ivPanel.scrollTop = 0;
    ivFondo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, easing: "ease-in" });
    ivAnim = ivPanel.animate([{ transform: "none", clipPath: "inset(0px 0px 0px 0px round 0px)" }, ivDesde(ivOrigen)], { duration: 360, easing: IV_CURVA, fill: "forwards" });
    ivAnim.onfinish = () => { ivAnim.cancel(); ivAnim = null; fin(); };
  }
  // Cerrar: botón, fondo, tecla Escape o el "atrás" del celular
  ivOv.querySelector(".iv-ov-cerrar").addEventListener("click", () => history.back());
  ivFondo.addEventListener("click", () => history.back());
  window.addEventListener("popstate", () => ivCerrar());
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !ivOv.hidden) history.back(); });
  // Tocar una foto de la grilla (solo en el celular)
  document.getElementById("iv-grupos").addEventListener("click", e => {
    if (!ivEsCelu()) return;
    const tile = e.target.closest(".iv-grid .iv-card");
    if (tile) { e.preventDefault(); ivAbrir(tile); }
  });
  document.getElementById("iv-grupos").addEventListener("keydown", e => {
    if (!ivEsCelu() || (e.key !== "Enter" && e.key !== " ")) return;
    const tile = e.target.closest(".iv-grid .iv-card");
    if (tile && e.target === tile) { e.preventDefault(); ivAbrir(tile); }
  });

  // La barra de grupos queda justo debajo del encabezado fijo de la tienda
  (function () {
    const h = document.querySelector("header");
    const poner = () => document.documentElement.style.setProperty("--iv-top", (h ? h.offsetHeight : 0) + "px");
    poner();
    if (h && "ResizeObserver" in window) new ResizeObserver(poner).observe(h);
    if (h) new MutationObserver(() => document.documentElement.classList.toggle("iv-sin-header", h.classList.contains("header--hidden")))
      .observe(h, { attributes: true, attributeFilter: ["class"] });
  })();

  // Barra que se esconde al bajar por la lista y vuelve al subir (sin perder el foco si se está escribiendo)
  (function () {
    let ultimo = scrollY, pend = false;
    const raiz = document.documentElement, nav = document.querySelector(".iv-nav");
    function revisar() {
      pend = false;
      const y = scrollY, g = document.getElementById("iv-grupos");
      const dentro = g && y > g.offsetTop - 20;
      const escribiendo = nav.contains(document.activeElement) && document.activeElement.tagName === "INPUT" && document.activeElement.type !== "range";
      if (!dentro || escribiendo || y < ultimo - 6) raiz.classList.remove("iv-nav-oculta");
      else if (y > ultimo + 6) raiz.classList.add("iv-nav-oculta");
      if (Math.abs(y - ultimo) > 6) ultimo = y;
    }
    addEventListener("scroll", () => { if (!pend) { pend = true; requestAnimationFrame(revisar); } }, { passive: true });
    nav.addEventListener("focusin", () => raiz.classList.remove("iv-nav-oculta"));
  })();

  let ivT = null;
  document.getElementById("iv-buscar").addEventListener("input", () => { clearTimeout(ivT); ivT = setTimeout(ivPintar, 180); });
  document.getElementById("iv-consulta").href = `https://wa.me/${IV_WA}?text=${encodeURIComponent("Hola! Tengo una consulta sobre los inflables: ")}`;

  cargarProductos().then(() => {
    if (CATALOGO_ERROR) {
      document.getElementById("iv-grupos").innerHTML = `<p class="iv-vacio">No pudimos cargar los inflables. <a href="javascript:location.reload()">Reintentar</a> o escribinos por WhatsApp.</p>`;
      return;
    }
    ivLista = PRODUCTOS.filter(p => p.categoria === "Inflables")
      .sort((a, b) => (typeof a.orden === "number" ? a.orden : 1e9) - (typeof b.orden === "number" ? b.orden : 1e9) || a.id - b.id);
    ivPresuIniciar();
    ivPintar();
    if (location.hash) {
      const el = document.getElementById(location.hash.slice(1));
      if (el) setTimeout(() => { el.scrollIntoView({ block: "center" }); if (el.classList.contains("iv-card") && ivEsCelu()) ivAbrir(el); }, 80);
    }
  });
</script>
</body>
</html>
