<script>
const APPS_URL = "https://script.google.com/macros/s/AKfycbzDLw6AMeSzr_pXwnzpisWWpnywQTjzjl-V6Lq1YDz7M4fc5kr4YOVuUnj6UYj2lmyE/exec";

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".copyright-year").forEach(el => el.textContent = new Date().getFullYear());
  const user = JSON.parse(localStorage.getItem('vsb_user') || 'null');
  user && user.nombre ? renderLoggedIn(user) : renderLogin();
});

async function hashPass(password, email) {
  const enc  = new TextEncoder();
  const data = enc.encode(email.toLowerCase().trim() + ':' + password);
  const buf  = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// â”€â”€ LOGIN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderLogin() {
  document.getElementById('mc-wrap').innerHTML = `
    <div class="mc-card">
      <h2><i class="fa-solid fa-right-to-bracket"></i>Iniciá Sesión</h2>
      <div class="mc-field-row">
        <input type="email" id="l-email" placeholder="Tu email" autocomplete="email" />
        <input type="password" id="l-pass" placeholder="Contraseña" autocomplete="current-password" />
        <button class="mc-btn-red" id="l-btn" onclick="doLogin()"><i class="fa-solid fa-right-to-bracket" style="margin-right:6px;"></i>Ingresar</button>
      </div>
      <div class="mc-msg error" id="l-err" style="display:none;"></div>
      <p style="text-align:center;margin-top:18px;font-size:0.83rem;color:var(--gray);">¿No tenés cuenta? <a href="index.html" style="color:var(--red);font-weight:600;">Registrate gratis â†’</a></p>
    </div>`;
  document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  const btn   = document.getElementById('l-btn');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Completá email y Contraseña.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Ingresando...';
  try {
    const hash = await hashPass(pass, email);
    const res  = await fetch(`${APPS_URL}?action=loginUser&email=${encodeURIComponent(email)}&hash=${hash}`, { redirect: 'follow' });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('vsb_user', JSON.stringify({ nombre: data.nombre, email: data.email }));
      renderLoggedIn({ nombre: data.nombre, email: data.email });
    } else {
      errEl.textContent = data.error === 'Usuario no encontrado' ? 'No encontramos esa cuenta.' : data.error || 'Error al ingresar.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket" style="margin-right:6px;"></i>Ingresar';
    }
  } catch {
    errEl.textContent = 'Error de conexión. Intentá de nuevo.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket" style="margin-right:6px;"></i>Ingresar';
  }
}

// â”€â”€ CUENTA â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderLoggedIn(user) {
  const hBtn = document.getElementById('header-user-btn');
  if (hBtn) { hBtn.style.display = 'flex'; hBtn.title = 'Hola, ' + user.nombre; }

  document.getElementById('mc-wrap').innerHTML = `
    <div class="mc-card" style="text-align:center;">
      <div class="mc-avatar">${user.nombre.charAt(0).toUpperCase()}</div>
      <div class="mc-nombre">${user.nombre}</div>
      <div class="mc-email-lbl">${user.email}</div>
    </div>

    <div class="mc-links">
      <a href="mis-compras.html" class="mc-link-card">
        <i class="fa-solid fa-box-open"></i><span>Mis compras</span>
      </a>
      <a href="favoritos.html" class="mc-link-card">
        <i class="fa-solid fa-heart"></i><span>Mis favoritos</span>
      </a>
    </div>

    <div class="mc-card">
      <h2><i class="fa-solid fa-lock"></i>Cambiar Contraseña</h2>
      <div class="mc-field-row">
        <input type="password" id="cp-old" placeholder="Contraseña actual" />
        <input type="password" id="cp-new" placeholder="Nueva Contraseña (mín. 6 caracteres)" />
        <input type="password" id="cp-new2" placeholder="Repetir nueva Contraseña" />
        <button class="mc-btn-red" id="cp-btn" onclick="doChangePass('${user.email}')">Cambiar Contraseña</button>
      </div>
      <div class="mc-msg" id="cp-msg" style="display:none;"></div>
    </div>

    <div class="mc-card">
      <h2><i class="fa-solid fa-shield-halved"></i>Sesión</h2>
      <p style="font-size:0.85rem;color:var(--gray);margin:0 0 4px;">Sesión activa en este dispositivo.</p>
      <button class="mc-btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket" style="margin-right:6px;"></i>Cerrar Sesión</button>
    </div>`;
}

async function doChangePass(email) {
  const oldPass = document.getElementById('cp-old').value;
  const newPass = document.getElementById('cp-new').value;
  const newPass2= document.getElementById('cp-new2').value;
  const msg     = document.getElementById('cp-msg');
  const btn     = document.getElementById('cp-btn');
  msg.style.display = 'none'; msg.className = 'mc-msg';
  if (!oldPass || !newPass) { msg.textContent = 'Completá todos los campos.'; msg.className = 'mc-msg error'; msg.style.display = 'block'; return; }
  if (newPass !== newPass2) { msg.textContent = 'Las Contraseñas nuevas no coinciden.'; msg.className = 'mc-msg error'; msg.style.display = 'block'; return; }
  if (newPass.length < 6)  { msg.textContent = 'La nueva Contraseña debe tener al menos 6 caracteres.'; msg.className = 'mc-msg error'; msg.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const oldHash = await hashPass(oldPass, email);
    const newHash = await hashPass(newPass, email);
    const res  = await fetch(`${APPS_URL}?action=changePassword&email=${encodeURIComponent(email)}&oldHash=${oldHash}&newHash=${newHash}`, { redirect: 'follow' });
    const data = await res.json();
    if (data.ok) { msg.textContent = 'âœ“ Contraseña actualizada.'; msg.className = 'mc-msg ok'; document.getElementById('cp-old').value=''; document.getElementById('cp-new').value=''; document.getElementById('cp-new2').value=''; }
    else { msg.textContent = data.error || 'Error al cambiar Contraseña.'; msg.className = 'mc-msg error'; }
  } catch { msg.textContent = 'Error de conexión.'; msg.className = 'mc-msg error'; }
  msg.style.display = 'block';
  btn.disabled = false; btn.textContent = 'Cambiar Contraseña';
}

function cerrarSesion() {
  if (!confirm('¿Seguro que querés cerrar Sesión?')) return;
  localStorage.removeItem('vsb_user');
  window.location.href = 'index.html';
}
</script>
