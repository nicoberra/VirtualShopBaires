<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta | Virtual Shop Baires</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    html, body { overflow-x: hidden; }
    .mc-page { min-height: 80vh; padding: 40px 0 80px; background: var(--black); }
    .mc-wrap { max-width: 560px; margin: 0 auto; }

    .mc-card { background: var(--black-3); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); margin-bottom: 18px; }
    .mc-card h2 { font-size: 1rem; font-weight: 700; color: var(--white); margin: 0 0 20px; display: flex; align-items: center; gap: 10px; }
    .mc-card h2 i { color: var(--red); }

    .mc-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; color: #fff; margin: 0 auto 16px; }
    .mc-nombre { font-size: 1.3rem; font-weight: 800; color: var(--white); text-align: center; }
    .mc-email  { font-size: 0.85rem; color: var(--gray); text-align: center; margin-top: 4px; }

    .mc-edit-btn { display: block; width: 100%; margin-top: 18px; padding: 11px; background: transparent; border: 1.5px solid var(--black-2); border-radius: 8px; color: var(--gray); font-size: 0.88rem; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    .mc-edit-btn:hover { border-color: var(--red); color: var(--white); }

    .mc-edit-form { display: none; margin-top: 18px; }
    .mc-edit-form input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--black-2); border-radius: 8px; font-size: 0.92rem; background: var(--black); color: var(--white); margin-bottom: 10px; box-sizing: border-box; }
    .mc-edit-form input:focus { outline: none; border-color: var(--red); }
    .mc-edit-form button { width: 100%; padding: 12px; background: var(--red); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.92rem; }

    .mc-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mc-link-card { background: var(--black-3); border-radius: var(--radius); padding: 20px 16px; text-align: center; text-decoration: none; color: var(--white); box-shadow: var(--shadow); transition: background 0.2s; }
    .mc-link-card:hover { background: var(--black-2); }
    .mc-link-card i { font-size: 1.6rem; color: var(--red); display: block; margin-bottom: 8px; }
    .mc-link-card span { font-size: 0.88rem; font-weight: 600; }

    .mc-logout { display: block; width: 100%; padding: 12px; background: transparent; border: 1.5px solid var(--black-2); border-radius: 8px; color: var(--gray); font-size: 0.88rem; cursor: pointer; margin-top: 8px; transition: border-color 0.2s, color 0.2s; }
    .mc-logout:hover { border-color: #cc3333; color: #cc3333; }

    .mc-no-user { text-align: center; padding: 60px 20px; }
    .mc-no-user i { font-size: 3rem; color: var(--gray-light); }
    .mc-no-user p { color: var(--gray); margin: 16px 0 24px; font-size: 0.92rem; }
    .mc-no-user a { display: inline-block; background: var(--red); color: #fff; padding: 12px 28px; border-radius: 50px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <span>🔒 Compra 100% segura</span>
    <span>|</span>
    <span>📦 Importador directo</span>
    <span>|</span>
    <span>⚡ Respuesta rápida</span>
  </div>
</div>

<header>
  <div class="container">
    <div class="header-inner">
      <div class="header-left">
        <button class="hamburger" id="hamburger" aria-label="Menú" aria-expanded="false" aria-controls="header-dropdown-nav"><span></span><span></span><span></span></button>
      </div>
      <a href="index.html" class="logo"><img src="logo.png" alt="Virtual Shop Baires" /></a>
      <div class="header-actions">
        <a href="mi-cuenta.html" class="user-action-btn" id="header-user-btn" style="display:none" aria-label="Mi cuenta"><i class="fa-solid fa-circle-user" aria-hidden="true"></i></a>
        <button class="cart-action-btn" onclick="openCart()" aria-label="Carrito de compras"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i><span id="cart-label" aria-live="polite">0</span></button>
      </div>
    </div>
  </div>
  <nav class="header-dropdown-nav" id="header-dropdown-nav" aria-label="Menú principal" aria-hidden="true">
    <div class="container">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="mis-compras.html">Mis compras</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>
</header>

<div class="page-hero" style="padding:24px 0;">
  <div class="container">
    <h1 style="font-size:1.6rem;text-align:center;">Mi <span style="color:var(--red);">cuenta</span></h1>
  </div>
</div>

<div class="mc-page">
  <div class="container">
    <div class="mc-wrap" id="mc-wrap"></div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="footer-bottom" style="padding:20px 0;text-align:center;">
      <span>© <span class="copyright-year"></span> Virtual Shop Baires. Todos los derechos reservados.</span>
    </div>
  </div>
</footer>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cart-panel">
  <div class="cart-header"><h2>🛒 Tu carrito</h2><button class="cart-close" onclick="closeCart()">✕</button></div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Total</span><span id="cart-total">$0</span></div>
    <button class="btn-checkout" onclick="window.location='checkout.html'">Finalizar compra →</button>
    <div class="mp-logo">🔒 Pago seguro · transferencia bancaria</div>
  </div>
</div>

<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".copyright-year").forEach(el => el.textContent = new Date().getFullYear());

  const user = JSON.parse(localStorage.getItem('vsb_user') || 'null');
  const wrap = document.getElementById('mc-wrap');

  if (!user || !user.nombre) {
    wrap.innerHTML = `
      <div class="mc-no-user">
        <i class="fa-regular fa-circle-user"></i>
        <p>No tenés una cuenta guardada en este dispositivo.</p>
        <a href="index.html">Ir al inicio para registrarte →</a>
      </div>`;
    return;
  }

  const inicial = user.nombre.charAt(0).toUpperCase();

  wrap.innerHTML = `
    <div class="mc-card" style="text-align:center;">
      <div class="mc-avatar">${inicial}</div>
      <div class="mc-nombre">${user.nombre}</div>
      <div class="mc-email">${user.email || 'Sin email guardado'}</div>
      <button class="mc-edit-btn" onclick="toggleEdit()"><i class="fa-solid fa-pen" style="margin-right:6px;"></i>Editar mis datos</button>
      <div class="mc-edit-form" id="edit-form">
        <input type="text" id="edit-nombre" placeholder="Nombre" value="${user.nombre}" maxlength="40" />
        <input type="email" id="edit-email" placeholder="Email" value="${user.email || ''}" />
        <button onclick="guardarCambios()">Guardar cambios</button>
      </div>
    </div>

    <div class="mc-links">
      <a href="mis-compras.html" class="mc-link-card">
        <i class="fa-solid fa-box-open"></i>
        <span>Mis compras</span>
      </a>
      <a href="favoritos.html" class="mc-link-card">
        <i class="fa-solid fa-heart"></i>
        <span>Mis favoritos</span>
      </a>
    </div>

    <div class="mc-card" style="margin-top:18px;">
      <h2><i class="fa-solid fa-shield-halved"></i>Sesión</h2>
      <p style="font-size:0.85rem;color:var(--gray);margin:0 0 12px;">Tu cuenta está guardada en este dispositivo. Si cerrás sesión, vas a tener que registrarte de nuevo.</p>
      <button class="mc-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket" style="margin-right:6px;"></i>Cerrar sesión</button>
    </div>`;
});

function toggleEdit() {
  const form = document.getElementById('edit-form');
  form.style.display = form.style.display === 'block' ? 'none' : 'block';
}

function guardarCambios() {
  const nombre = document.getElementById('edit-nombre').value.trim();
  const email  = document.getElementById('edit-email').value.trim();
  if (!nombre) return;
  localStorage.setItem('vsb_user', JSON.stringify({ nombre, email }));
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_xYydK11_avPhLpaaeK4Q4PSOkR4FhueeUr5EEQmCXxsRP75BRfooZdQP2pUljTLL/exec";
  try { fetch(`${APPS_SCRIPT_URL}?action=registerUser&nombre=${encodeURIComponent(nombre)}&email=${encodeURIComponent(email)}`, { redirect: 'follow' }); } catch(_) {}
  location.reload();
}

function cerrarSesion() {
  if (!confirm('¿Seguro que querés cerrar sesión?')) return;
  localStorage.removeItem('vsb_user');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
